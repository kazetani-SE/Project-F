name: Deploy to AWS (S3/CloudFront & ECS Fargate)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: 'Deploy Frontend to S3 & CloudFront'
        type: boolean
        default: true
      deploy_backend:
        description: 'Build & Deploy Backend to ECR & ECS Fargate'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      be: ${{ steps.decide.outputs.be }}
      fe: ${{ steps.decide.outputs.fe }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            be:
              - 'backend/**'
              - '.github/workflows/deploy.yaml'
            fe:
              - 'frontend/**'
              - '.github/workflows/deploy.yaml'

      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "fe=${{ inputs.deploy_frontend }}" >> "$GITHUB_OUTPUT"
            echo "be=${{ inputs.deploy_backend }}" >> "$GITHUB_OUTPUT"
          else
            echo "fe=${{ steps.filter.outputs.fe }}" >> "$GITHUB_OUTPUT"
            echo "be=${{ steps.filter.outputs.be }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    needs: changes
    if: needs.changes.outputs.fe == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production SPA bundle
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_USE_MOCK: 'false'
          VITE_MOCK_STORAGE: 'false'
        run: npm run build

      - name: Configure AWS credentials (OIDC Role)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (IAM Access Key)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync static assets to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.S3_FRONTEND_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp frontend/dist/index.html "s3://${{ vars.S3_FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  deploy-backend:
    name: Deploy Backend (ECR + ECS Fargate)
    needs: changes
    if: needs.changes.outputs.be == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC Role)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (IAM Access Key)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY || 'project-f-backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

          docker buildx build \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "${IMAGE_URI}" \
            -t "${LATEST_URI}" \
            --push \
            ./backend

          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Fetch current ECS Task Definition from AWS
        env:
          TASK_FAMILY: ${{ vars.ECS_TASK_DEFINITION_FAMILY || 'project-f-backend-task' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-def-raw.json

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-def-raw.json > task-definition.json

      - name: Render new image into ECS Task Definition
        id: render-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME || 'backend' }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS Task Definition to Fargate Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE || 'project-f-backend-service' }}
          cluster: ${{ vars.ECS_CLUSTER || 'project-f-cluster' }}
          wait-for-service-stability: true
