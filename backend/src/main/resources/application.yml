server:
  port: ${PORT}
  servlet:
    context-path: /api

spring:
  application:
    name: project-f-club-backend

  # Profile gốc chỉ nạp duy nhất file .env gốc của backend
  config:
    import:
      - optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # PostgreSQL Configuration (Amazon RDS / Supabase / Local)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Spring Data JPA / Hibernate Configuration (Profile gốc tối ưu cho Production)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES}

logging:
  level:
    root: INFO
    com.projectf: INFO
