server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: project-f-club-backend

  # Nạp biến môi trường của backend theo thứ tự ưu tiên: .env (gốc) -> .env.local (ghi đè cá nhân)
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:.env.local[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # PostgreSQL Configuration (Amazon RDS / Supabase / Local)
  datasource:
    url: ${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/project_f_db}}
    username: ${DB_USERNAME:${SUPABASE_DB_USER:postgres}}
    password: ${DB_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  # Flyway Database Migration Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # Spring Data JPA / Hibernate Configuration (Profile gốc tối ưu cho Production)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

aws:
  region: ${AWS_REGION:ap-southeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET:project-f-media-storage}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES:10}

logging:
  level:
    root: INFO
    com.projectf: INFO
