server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

spring:
  application:
    name: project-f-club-backend

  mail:
    host: ${SPRING_MAIL_HOST:127.0.0.1}
    port: ${SPRING_MAIL_PORT:54325}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

  # IntelliJ có thể chạy từ thư mục gốc dự án hoặc backend; nạp .env ở cả hai vị trí.
  config:
    import:
      - optional:file:backend/.env[.properties]
      - optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  # PostgreSQL Configuration (Amazon RDS / Local)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Spring Data JPA / Hibernate Configuration (Profile gốc tối ưu cho Production)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

aws:
  region: ${AWS_REGION:ap-southeast-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  session-token: ${AWS_SESSION_TOKEN:}
  cognito:
    region: ${AWS_COGNITO_REGION:${AWS_REGION:ap-southeast-1}}
    user-pool-id: ${AWS_COGNITO_USER_POOL_ID:}
    client-id: ${AWS_COGNITO_CLIENT_ID:}
    client-secret: ${AWS_COGNITO_CLIENT_SECRET:}
  ses:
    region: ${AWS_SES_REGION:${AWS_REGION:ap-southeast-1}}
    enabled: ${AWS_SES_ENABLED:true}
    configuration-set: ${AWS_SES_CONFIGURATION_SET:}
  s3:
    bucket-name: ${AWS_S3_BUCKET:project-f-media-storage}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES:10}

app:
  ai:
    provider: ${AI_PROVIDER:bedrock}
    bedrock:
      region: ${AWS_BEDROCK_REGION:${AWS_REGION:us-east-1}}
      fast-model-id: ${BEDROCK_FAST_MODEL_ID:anthropic.claude-3-haiku-20240307-v1:0}
      deep-model-id: ${BEDROCK_DEEP_MODEL_ID:anthropic.claude-3-5-sonnet-20240620-v1:0}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      fast-model-id: ${GEMINI_FAST_MODEL_ID:gemini-3.5-flash-lite}
      deep-model-id: ${GEMINI_DEEP_MODEL_ID:gemini-3.5-flash}

# SpringDoc OpenAPI 3.0 & Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
    filter: true

benchmark:
  ai:
    mode: ${BENCHMARK_AI_MODE:cache} # cache for mock and live for real
    cache-file: ${BENCHMARK_AI_CACHE_FILE:classpath:cache/benchmark-ai-cache.json}

logging:
  level:
    root: INFO
    com.projectf: INFO
