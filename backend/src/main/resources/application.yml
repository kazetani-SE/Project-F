server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: project-f-club-backend

  # Profile gốc chỉ nạp duy nhất file .env gốc của backend
  config:
    import:
      - optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}

  # PostgreSQL Configuration (Bắt buộc khai báo biến môi trường, không dùng default ở profile gốc)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Flyway Database Migration Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # Spring Data JPA / Hibernate Configuration (Profile gốc tối ưu cho Production)
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

aws:
  region: ${AWS_REGION}
  s3:
    bucket-name: ${AWS_S3_BUCKET}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_EXPIRATION_MINUTES:10}

logging:
  level:
    root: INFO
    com.projectf: INFO
